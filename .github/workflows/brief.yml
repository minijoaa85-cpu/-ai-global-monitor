name: Publish weekly AI pulse and V4.3 history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/weekly_brief.py'
      - 'tests/test_weekly_brief.py'
      - 'site/weekly-pulse.js'
      - 'site/weekly-pulse.css'
      - '.github/workflows/brief.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: https://minijoaa85-cpu.github.io/-ai-global-monitor/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evidence-bound weekly insights
        run: |
          python -m unittest discover -s tests -p test_weekly_brief.py -v
          node --check site/weekly-pulse.js
          python src/weekly_brief.py
          test -s site/data/weekly_brief.json
      - name: Save latest briefing snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/weekly_brief.json
          if ! git diff --cached --quiet; then
            git commit -m "insight: update grounded weekly AI pulse"
            git pull --rebase origin main
            git push
          fi
      - name: Build History PDF and PPTX
        run: |
          python -m pip install --disable-pip-version-check python-pptx reportlab
          python -m unittest discover -s tests -p test_version_history.py -v
          node --check site/history.js
          python scripts/build_history_slides.py
          test -s site/docs/ai-observatory-version-history.pdf
          test -s site/docs/ai-observatory-version-history.pptx
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry deploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
