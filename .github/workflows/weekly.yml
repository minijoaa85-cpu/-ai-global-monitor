name: Weekly AI benchmark collection
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * 1' # Every Monday, 09:20 Asia/Seoul
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    environment:
      name: github-pages
      url: https://minijoaa85-cpu.github.io/-ai-global-monitor/
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collectors and dashboard code
        run: |
          python -m unittest discover -s tests -v
          node --check site/v4.js
      - name: Collect official evaluation sources
        run: |
          python src/monitor.py
          python src/report.py
      - name: Commit updated weekly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json site/data/status.json site/weekly-report.html
          if ! git diff --cached --quiet; then
            git commit -m "data: weekly official benchmark snapshot"
            git pull --rebase origin main
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build verified History PDF / PPT
        run: |
          python -m pip install --disable-pip-version-check python-pptx reportlab
          python -m unittest discover -s tests -p test_version_history.py -v
          node --check site/history.js
          python scripts/build_history_slides.py
          test -s site/docs/ai-observatory-version-history.pdf
          test -s site/docs/ai-observatory-version-history.pptx
      - name: Upload refreshed dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry Pages publish if artifact metadata temporarily fails
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
