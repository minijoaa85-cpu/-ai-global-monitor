name: Weekly AI benchmark collection
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * 1' # Every Monday, 09:20 Asia/Seoul
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official evaluation sources
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          HF_BENCHMARK_DATASETS: ${{ vars.HF_BENCHMARK_DATASETS }}
          ENABLE_LIVEBENCH: '0'
        run: |
          python src/monitor.py
          python src/report.py
      - name: Commit updated weekly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json site/data/status.json site/weekly-report.html
          if ! git diff --cached --quiet; then
            git commit -m "data: weekly official benchmark snapshot"
            git push
          fi
