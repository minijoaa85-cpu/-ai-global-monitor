name: Weekly AI benchmark collection
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/weekly.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * 1' # Every Monday, 09:20 Asia/Seoul
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official evaluation sources
        run: |
          python src/monitor.py
          python src/report.py
      - name: Commit updated weekly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json site/data/status.json site/weekly-report.html
          if ! git diff --cached --quiet; then
            git commit -m "data: weekly official benchmark snapshot"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
