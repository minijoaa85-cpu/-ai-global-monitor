name: AI model news and release radar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/news.py'
      - '.github/workflows/news.yml'
      - 'tests/test_news.py'
      - 'site/news.js'
      - 'site/index.html'
      - 'site/v4.css'
  schedule:
    - cron: '55 0 * * *' # 09:55 KST daily, after weekly benchmark collection
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official news feed parser
        run: |
          python -m unittest discover -s tests -p 'test_news.py' -v
          node --check site/news.js
      - name: Fetch AI announcements and links
        run: python src/news.py
      - name: Commit news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "news: daily AI model releases and updates"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
