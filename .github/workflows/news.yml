name: AI model news and release radar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/news.py'
      - '.github/workflows/news.yml'
      - 'tests/test_news.py'
      - 'site/news.js'
  schedule:
    - cron: '55 0 * * *' # 09:55 KST daily, after weekly benchmark collection
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: https://minijoaa85-cpu.github.io/-ai-global-monitor/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official news feed parser
        run: |
          python -m unittest discover -s tests -p 'test_news.py' -v
          node --check site/news.js
      - name: Fetch AI announcements and links
        run: python src/news.py
      - name: Commit news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "news: daily AI model releases and updates"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Build verified History PDF / PPT
        run: |
          python -m pip install --disable-pip-version-check python-pptx reportlab
          python -m unittest discover -s tests -p test_version_history.py -v
          node --check site/history.js
          python scripts/build_history_slides.py
          test -s site/docs/ai-observatory-version-history.pdf
          test -s site/docs/ai-observatory-version-history.pptx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry Pages publish if artifact metadata temporarily fails
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
