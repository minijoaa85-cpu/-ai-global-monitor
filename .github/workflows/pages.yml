name: Publish AI benchmark dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build verified History PDF / PPT
        run: |
          python -m pip install --disable-pip-version-check python-pptx reportlab
          python -m unittest discover -s tests -p test_version_history.py -v
          node --check site/history.js
          python scripts/build_history_slides.py
          test -s site/docs/ai-observatory-version-history.pdf
          test -s site/docs/ai-observatory-version-history.pptx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
